name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '.terraform.lock.hcl'
      - '.github/workflows/terraform-apply.yml'
      - 'terraform.tfvars.example'

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform initialize
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color -var-file=terraform.tfvars.example -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
